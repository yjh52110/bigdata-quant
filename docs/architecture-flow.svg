<rect x="250" y="146" width="180" height="52" rx="4" class="m"/><text class="t" x="340" y="168" text-anchor="middle">hypersync_ingestion</text><text class="s" x="340" y="186" text-anchor="middle">code ready</text>
<line class="ar" x1="130" y1="198" x2="130" y2="242" marker-end="url(#a)"/><line class="ar" x1="340" y1="198" x2="340" y2="242" marker-end="url(#a)"/>
