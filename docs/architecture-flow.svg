.ar{stroke:#64748b;stroke-width:1.5;fill:none}
</style></defs>
<rect x="40" y="48" width="180" height="52" rx="4" class="g"/><text class="t" x="130" y="70" text-anchor="middle">Binance vision</text><text class="s" x="130" y="88" text-anchor="middle">free bulk klines</text>
