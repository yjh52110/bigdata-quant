<svg width="680" height="656" viewBox="0 0 680 656" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
<title>ChainQuant platform data flow</title>
<desc>Pipeline from data sources through ingestion, Parquet storage, DuckDB compute, and the MCP and admin serving layers to clients. Green = verified working; amber = code complete, needs credentials.</desc>
