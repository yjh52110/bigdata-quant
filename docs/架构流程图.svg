<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, system-ui, sans-serif">
<title>ChainQuant 平台完整数据流程图</title>
<desc>从数据源经采集、Parquet 存储、DuckDB 计算，到 MCP 服务与管理后台，最终到达用户端。绿色为已验证可用，橙色为代码完成但需配置凭据。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>.t{font-size:14px;font-weight:500;fill:#0f172a}.s{font-size:12px;fill:#475569}.g{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}.m{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}.ar{stroke:#64748b;stroke-width:1.5;fill:none}</style></defs>
<text class="s" x="40" y="36">① 数据源</text>
<rect x="40" y="46" width="180" height="54" rx="4" class="g"/><text class="t" x="130" y="69" text-anchor="middle">币安公开数据</text><text class="s" x="130" y="88" text-anchor="middle">免费，无需密钥</text>
<rect x="250" y="46" width="180" height="54" rx="4" class="m"/><text class="t" x="340" y="69" text-anchor="middle">Hypersync 链上</text><text class="s" x="340" y="88" text-anchor="middle">需申请免费令牌</text>
<line class="ar" x1="130" y1="100" x2="130" y2="148" marker-end="url(#a)"/><line class="ar" x1="340" y1="100" x2="340" y2="148" marker-end="url(#a)"/>
<text class="s" x="40" y="142">② 采集</text>
<rect x="40" y="152" width="180" height="54" rx="4" class="g"/><text class="t" x="130" y="175" text-anchor="middle">行情采集模块</text><text class="s" x="130" y="194" text-anchor="middle">已跑通真实数据</text>
<rect x="250" y="152" width="180" height="54" rx="4" class="m"/><text class="t" x="340" y="175" text-anchor="middle">链上采集模块</text><text class="s" x="340" y="194" text-anchor="middle">代码就绪待验证</text>
<line class="ar" x1="130" y1="206" x2="130" y2="254" marker-end="url(#a)"/><line class="ar" x1="340" y1="206" x2="340" y2="254" marker-end="url(#a)"/>
<text class="s" x="40" y="248">③ 存储</text>
<rect x="40" y="258" width="350" height="54" rx="4" class="g"/><text class="t" x="215" y="281" text-anchor="middle">本地 Parquet 数据湖</text><text class="s" x="215" y="300" text-anchor="middle">ZSTD 压缩，按时间排序</text>
<rect x="460" y="258" width="180" height="54" rx="4" class="m"/><text class="t" x="550" y="281" text-anchor="middle">谷歌云盘归档</text><text class="s" x="550" y="300" text-anchor="middle">需授权与 rclone</text>
<text class="s" x="425" y="278" text-anchor="middle">合并上传</text>
<line class="ar" x1="390" y1="286" x2="458" y2="286" marker-end="url(#a)"/>
<line class="ar" x1="215" y1="312" x2="215" y2="360" marker-end="url(#a)"/>
<text class="s" x="40" y="354">④ 计算</text>
<rect x="40" y="364" width="350" height="54" rx="4" class="g"/><text class="t" x="215" y="387" text-anchor="middle">DuckDB 内存引擎</text><text class="s" x="215" y="406" text-anchor="middle">仅允许只读查询</text>
<line class="ar" x1="130" y1="418" x2="130" y2="466" marker-end="url(#a)"/><line class="ar" x1="340" y1="418" x2="340" y2="466" marker-end="url(#a)"/>
<text class="s" x="40" y="460">⑤ 服务</text>
<rect x="40" y="470" width="180" height="54" rx="4" class="g"/><text class="t" x="130" y="493" text-anchor="middle">MCP 服务端</text><text class="s" x="130" y="512" text-anchor="middle">独立密钥与配额</text>
<rect x="250" y="470" width="180" height="54" rx="4" class="g"/><text class="t" x="340" y="493" text-anchor="middle">管理后台接口</text><text class="s" x="340" y="512" text-anchor="middle">密码鉴权</text>
<rect x="460" y="470" width="180" height="54" rx="4" class="m"/><text class="t" x="550" y="493" text-anchor="middle">Gemini 密钥池</text><text class="s" x="550" y="512" text-anchor="middle">需 API 密钥</text>
<line class="ar" x1="430" y1="497" x2="458" y2="497" marker-end="url(#a)"/>
<line class="ar" x1="130" y1="524" x2="130" y2="574" marker-end="url(#a)"/><line class="ar" x1="340" y1="524" x2="340" y2="574" marker-end="url(#a)"/>
<line class="ar" x1="430" y1="524" x2="478" y2="574" marker-end="url(#a)"/>
<text class="s" x="40" y="568">⑥ 使用端</text>
<rect x="40" y="578" width="180" height="54" rx="4" class="g"/><text class="t" x="130" y="601" text-anchor="middle">你的用户</text><text class="s" x="130" y="620" text-anchor="middle">Claude 等客户端</text>
<rect x="250" y="578" width="180" height="54" rx="4" class="g"/><text class="t" x="340" y="601" text-anchor="middle">管理面板</text><text class="s" x="340" y="620" text-anchor="middle">七个功能板块</text>
<rect x="460" y="578" width="180" height="54" rx="4" class="m"/><text class="t" x="550" y="601" text-anchor="middle">Telegram 告警</text><text class="s" x="550" y="620" text-anchor="middle">需机器人令牌</text>
<rect x="40" y="662" width="14" height="14" rx="3" class="g"/><text class="s" x="62" y="673">已验证可用</text>
<rect x="200" y="662" width="14" height="14" rx="3" class="m"/><text class="s" x="222" y="673">代码完成，等你配置凭据</text>
</svg>
